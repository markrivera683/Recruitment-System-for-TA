name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - feature
      - enhancement
  - title: '🐛 Bug Fixes'
    labels:
      - fix
      - bug
  - title: '📝 Documentation'
    labels:
      - documentation
  - title: '🧰 Maintenance'
    labels:
      - chore
      - refactor

change-template: '- $TITLE (@$AUTHOR) (#$NUMBER)'
no-changes-label: 'skip-changelog'
