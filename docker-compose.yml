services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@bupt.local
      LM_ENABLED: "true"
      LM_PROVIDER: mock
    volumes:
      - cvdata:/usr/local/tomcat/webapps/ta-recruitment/WEB-INF/data/cv
      - appdata:/usr/local/tomcat/webapps/ta-recruitment/WEB-INF/data

volumes:
  cvdata:
  appdata:
